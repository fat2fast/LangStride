name: Bug Report
description: Create a report to help us improve the application or infrastructure
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please ensure you are testing against a clean local environment with supported Node/pnpm versions.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed reproduction steps using local commands.
      placeholder: |
        1. Run `pnpm dev`
        2. Navigate to `http://localhost:3000/php`
        3. Click on ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node version, Docker version, pnpm version.
      placeholder: |
        - OS: Ubuntu 24.04 (WSL2)
        - Node: v22.x / v26.x
        - pnpm: v12.x
        - Docker: 28.x
    validations:
      required: true
